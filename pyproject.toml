[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/__pycache__"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "pytest-mypy-plugins>=4.1.0",
    "mypy>=1.17",
    "ruff>=0.17,<0.18",
    "types-requests>=2.33.0.20261006",
    "asyncpg-stubs>=0.32.0",
]

[tool.ruff]
# Pinned with ruff itself in the dev group: its default rules change between versions, and those are the rules kept.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # The repo imports Callable, Awaitable and the like from typing, throughout.
    "UP035",
    # Key carries its type only for checking, so a type parameter in the 3.12 syntax would be inferred as
    # interchangeable: a TypeVar keeps it invariant, so a key of one type never passes for another.
    "UP046",
]

[tool.ruff.lint.isort]
known-first-party = ["cordis", "cordis_loader", "cordis_plugins", "examples"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/cordis/src", "packages/cordis/tests",
    "packages/loader/src", "packages/loader/tests",
    "packages/plugins/src", "packages/plugins/tests",
    "packages/examples/src", "packages/examples/tests",
]
mypy_path = ["packages/cordis/src", "packages/loader/src", "packages/plugins/src", "packages/examples/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
timeout = 1
# importlib keeps each package's tests package separate; typing cases share one mypy process rather than starting one
# each. Only internal tests run by default: `pytest -m external` runs the external ones, `pytest -m ""` runs everything.
addopts = ["--mypy-pyproject-toml-file", "pyproject.toml", "--import-mode=importlib", "--mypy-same-process", "-m", "not external"]
markers = [
    "external: depends on something outside the test's own process, such as mypy. Unmarked tests are internal, and are kept off the network.",
]
