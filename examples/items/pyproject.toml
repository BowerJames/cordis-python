[project]
name = "cordis-example-items"
version = "0.1.0"
description = "An items API with discovery, keeping its items in memory or in SQLite."
authors = [
    { name = "James Bower", email = "bower.james1996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["cordis", "cordis-loader", "cordis-plugins"]

[project.scripts]
site-example = "items.entrypoints.site_server:main"

[tool.uv.sources]
cordis = { workspace = true }
cordis-loader = { workspace = true }
cordis-plugins = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "items"
