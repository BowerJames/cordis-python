- case: get_returns_the_type_the_key_carries
  main: |
    from cordis import Context, Key

    NUMBER: Key[int] = Key("number")

    def apply(ctx: Context) -> None:
        reveal_type(ctx.get(NUMBER))  # N: Revealed type is "int"
        reveal_type(ctx.find(NUMBER))  # N: Revealed type is "int | None"

- case: provide_rejects_a_value_of_another_type
  main: |
    from cordis import Context, Key

    NUMBER: Key[int] = Key("number")

    def apply(ctx: Context) -> None:
        ctx.provide(NUMBER, "one")  # E: Cannot infer value of type parameter "T" of "provide" of "Context"  [misc]

- case: keys_are_invariant
  main: |
    from cordis import Key

    NUMBER: Key[int] = Key("number")
    OBJECT: Key[object] = NUMBER  # E: Incompatible types in assignment (expression has type "Key[int]", variable has type "Key[object]")  [assignment]

- case: provide_by_takes_a_function_of_metadata_returning_the_key_type
  main: |
    from cordis import Context, Key, Metadata

    NAME: Key[str] = Key("name")

    def apply(ctx: Context) -> None:
        ctx.provide_by(NAME, lambda metadata: str(metadata.get("prefix", "")))
        ctx.provide_by(NAME, lambda metadata: 1)  # E: Argument 2 to "provide_by" of "Context" has incompatible type "Callable[[Mapping[str, object]], int]"; expected "Callable[[Mapping[str, object]], str]"  [arg-type]  # E: Incompatible return value type (got "int", expected "str")  [return-value]
