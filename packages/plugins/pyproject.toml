[project]
name = "cordis-plugins"
version = "0.1.0"
description = "Contracts (keys and the promises behind them) and the components keeping them: an application lifetime, stdio, the environment, a command line, HTTP clients and servers, an event bus, SQL on SQLite and Postgres, OpenAI clients and timers."
authors = [
    { name = "James Bower", email = "bower.james1996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cordis",
    "cordis-loader",
    "requests>=2.32",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai[realtime]>=3.8.0",
    "websockets>=15",
    "asyncpg>=0.30",
]

[tool.uv.sources]
cordis = { workspace = true }
cordis-loader = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plugins"
