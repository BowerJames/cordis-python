[project]
name = "cordis-loader"
version = "0.1.0"
description = "Declarative configuration for cordis: a tree of entries, reconciled into fibers as it changes."
authors = [
    { name = "James Bower", email = "bower.james1996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["cordis"]

[tool.uv.sources]
cordis = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
