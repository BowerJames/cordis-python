[project]
name = "cordis-examples"
version = "0.1.0"
description = "Applications composed from cordis components, each started from a script."
authors = [
    { name = "James Bower", email = "bower.james1996@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["cordis", "cordis-loader", "cordis-plugins", "pathspec>=1.1", "textual>=8.2.8"]

[project.scripts]
bot-example = "examples.bot.main:main"
curl-example = "examples.entrypoints.curl:main"
echo-server = "examples.entrypoints.echo_server:main"
site-example = "examples.entrypoints.site_server:main"
chat-server = "examples.entrypoints.chat_server:main"

[tool.uv.sources]
cordis = { workspace = true }
cordis-loader = { workspace = true }
cordis-plugins = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "examples"
